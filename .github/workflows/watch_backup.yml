name: Watch Huma (backup Playwright)

on:
  repository_dispatch:
    types: [check-tickets-backup]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Restore last state
        uses: actions/cache@v5
        with:
          path: last_state_backup.txt
          key: huma-backup-${{ github.run_id }}
          restore-keys: huma-backup-

      - name: Check tickets (backup)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch_tickets_backup.py

      - name: Save state
        uses: actions/cache@v5
        with:
          path: last_state_backup.txt
          key: huma-backup-${{ github.run_id }}
