name: Watch Huma camping tickets

on:
  repository_dispatch:
    types: [check-tickets]
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notification de test ?"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Restore last state
        uses: actions/cache@v5
        with:
          path: |
            last_state.txt
            error_count.txt
          key: huma-state-${{ github.run_id }}
          restore-keys: huma-state-

      - name: Check tickets
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            python watch_tickets.py --test
          else
            timeout 285 python -u watch_tickets.py --loop --interval 15 || true
          fi

      - name: Save state
        uses: actions/cache@v5
        with:
          path: |
            last_state.txt
            error_count.txt
          key: huma-state-${{ github.run_id }}
