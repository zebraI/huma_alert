name: Watch Huma camping tickets

on:
  repository_dispatch:
    types: [check-tickets]
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notification de test ?"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restore last state
        uses: actions/cache@v5
        with:
          path: |
            last_state.txt
            error_count.txt
          key: huma-state-${{ github.run_id }}
          restore-keys: huma-state-

      - name: Check tickets
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python watch_tickets.py ${{ github.event.inputs.test == 'true' && '--test' || '' }}

      - name: Save state
        uses: actions/cache@v5
        with:
          path: |
            last_state.txt
            error_count.txt
          key: huma-state-${{ github.run_id }}
