name: Watch Huma camping tickets

on:
  schedule:
    # Toutes les 15 minutes (le minimum fiable sur GitHub Actions ~5min,
    # mais en pratique GitHub ne garantit pas la précision à la minute près)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # permet de lancer manuellement depuis l'onglet Actions

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restore last state
        uses: actions/cache@v4
        with:
          path: last_state.txt
          key: huma-state-${{ github.run_id }}
          restore-keys: huma-state-

      - name: Check tickets
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python watch_tickets.py

      - name: Save state
        uses: actions/cache@v4
        with:
          path: last_state.txt
          key: huma-state-${{ github.run_id }}
